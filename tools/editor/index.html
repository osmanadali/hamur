<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamur · Bölüm editörü</title>
<style>
/* Bölüm editörü: geliştirme aracı, oyuna paketlenmez. Solda tahta ve araçlar, sağda çözücü raporu ve bölüm dosyası. */
:root{
  --desk:#12161f; --panel:#1c2230; --field:#1b2230; --grid:#2a3447; --wall:#5a6884; --ink:#eef2f9; --dim:#97a4bc; --warn:#ff6257; --ok:#35cf74;
  --r:#f4525f; --y:#ffc83a; --b:#3f8cff; --g:#35cf74; --o:#ff8b3a; --p:#a56cf2;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
h1{font-size:20px;margin:0 0 4px} h2{font-size:15px;margin:18px 0 8px;color:var(--dim);font-weight:600}
p{margin:0 0 10px;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:7px 11px}
button{cursor:pointer;font-weight:600}
button.ana{background:var(--y);color:#2a2105;border-color:var(--y)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.cell:focus-visible{outline:2px solid var(--y);outline-offset:2px}
input[type=number]{width:72px}
input[type=text]{flex:1;min-width:180px}
label{color:var(--dim);display:inline-flex;gap:6px;align-items:center}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-bottom:6px}
.tool{height:40px;padding:0;display:grid;place-items:center;border-radius:10px;border:2px solid transparent;background:var(--panel)}
.tool[aria-pressed=true]{border-color:var(--ink)}
.tool i{width:22px;height:22px;border-radius:7px;display:block}
.tool i.kalip{background:transparent;border:2px dashed}
.board{display:grid;gap:2px;background:var(--grid);padding:2px;border-radius:12px;width:min(100%,460px);touch-action:none;user-select:none}
.cell{aspect-ratio:1;background:var(--field);border-radius:6px;position:relative;display:grid;place-items:center}
.cell.duvar{background:var(--wall)}
.cell .parca{position:absolute;inset:8%;border-radius:22%}
.cell .kalip{position:absolute;inset:3%;border:3px dashed;border-radius:14%}
.cell .mk{position:absolute;font-size:20px;color:#e8edf7;opacity:.85}
.cell .no{position:relative;font-weight:700;font-size:13px;color:#10141c}
.rapor{background:var(--panel);border-radius:14px;padding:14px 16px}
.rapor dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.rapor dt{color:var(--dim)} .rapor dd{margin:0;font-variant-numeric:tabular-nums}
.iyi{color:var(--ok)} .kotu{color:var(--warn)}
ol{margin:8px 0 0;padding-left:22px} li{margin:2px 0}
li[aria-current=true]{color:var(--y)}
textarea{width:100%;min-height:150px;font:13px/1.4 ui-monospace,monospace;white-space:pre}
small{color:var(--dim)}
</style>
</head>
<body>
<main>
  <section>
    <h1>Bölüm editörü</h1>
    <p>Araç seç, tahtaya çiz. Bitişik aynı renk kareler tek parça (ya da tek kalıp) sayılır.</p>
    <div class="row">
      <label>Hazır bölüm <select id="hazir"></select></label>
      <label>En <input type="number" id="en" min="2" max="7" value="5"></label>
      <label>Boy <input type="number" id="boy" min="2" max="7" value="5"></label>
      <button id="temizle" type="button">Temizle</button>
    </div>
    <div class="tools" id="tools" role="group" aria-label="Araçlar"></div>
    <p><small id="arac"></small></p>
    <div class="board" id="board"></div>
    <div class="row" style="margin-top:12px">
      <label>Süre (sn) <input type="number" id="sure" min="5" max="600" value="45"></label>
      <button id="oner" type="button" disabled>Önerilen süreyi uygula</button>
    </div>
    <div class="row"><input type="text" id="ipTr" placeholder="İpucu (Türkçe)" aria-label="İpucu (Türkçe)"></div>
    <div class="row"><input type="text" id="ipEn" placeholder="Hint (English)" aria-label="İpucu (İngilizce)"></div>
  </section>
  <section>
    <div class="row">
      <button class="ana" id="coz" type="button">Çöz</button>
      <button id="geri" type="button" disabled>‹ Önceki hamle</button>
      <button id="ileri" type="button" disabled>Sonraki hamle ›</button>
      <button id="dene" type="button">Oyunda dene</button>
    </div>
    <div class="rapor" id="rapor" aria-live="polite"><p style="margin:0">Henüz çözülmedi.</p></div>
    <h2>Bölüm dosyası</h2>
    <textarea id="json" spellcheck="false" aria-label="Bölüm dosyası (JSON)"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="al" type="button">Metinden içe al</button>
      <button id="kopya" type="button">Kopyala</button>
      <button id="indir" type="button">Dosya olarak indir</button>
      <small id="not"></small>
    </div>
  </section>
</main>
<script src="../../www/rules/cekirdek.js"></script>
<script src="../../www/rules/cozucu.js"></script>
<script src="../../www/bolumler.js"></script>
<script>
(() => {
'use strict';
const K = window.HamurKural, C = window.HamurCozucu, B = window.HAMUR_BOLUMLER, $ = id => document.getElementById(id);
const AD = { r: 'kırmızı', y: 'sarı', b: 'mavi', g: 'yeşil', o: 'turuncu', p: 'mor' }, TIP = { otur: 'kalıba oturur', yapis: 'yapışır', yer: 'yer değiştirir', kes: 'makasa itilir, kesilir' };
// Araçlar: silgi, duvar, altı parça rengi, altı kalıp rengi
const TOOLS = [{ k: '.', ad: 'Silgi: kareyi boşaltır (parça, duvar ve kalıp)' }, { k: '#', ad: 'Duvar' },
  ...'rybgop'.split('').map(c => ({ k: c, ad: `Parça: ${AD[c]}` })), ...'RYBGOP'.split('').map(c => ({ k: c, ad: `Kalıp: ${AD[c.toLowerCase()]}` })), { k: 'x', ad: 'Makas karesi: tek kullanımlık, itilen çok kareli parçadan bir kare koparır' }];
let W = 5, H = 5, map = [], molds = [], tool = 'r', rap = null, adim = 0, boya = false;

const bos = () => { map = Array.from({ length: H }, () => Array(W).fill('.')); molds = Array.from({ length: H }, () => Array(W).fill('.')); };
const bolum = () => ({ t: +$('sure').value || 45, hint: [$('ipTr').value, $('ipEn').value], map: map.map(r => r.join('')), molds: molds.map(r => r.join('')) });
function yukle(L) {
  H = L.map.length; W = L.map[0].length; map = L.map.map(r => [...r]); molds = L.molds.map(r => [...r]);
  $('en').value = W; $('boy').value = H; $('sure').value = L.t || 45;
  const h = Array.isArray(L.hint) ? L.hint : [L.hint || '', '']; $('ipTr').value = h[0] || ''; $('ipEn').value = h[1] || '';
  degisti();
}
function boyut(w, h) {
  w = Math.max(2, Math.min(7, w | 0)); h = Math.max(2, Math.min(7, h | 0));
  const yeni = (a) => Array.from({ length: h }, (_, y) => Array.from({ length: w }, (_, x) => a[y]?.[x] ?? '.'));
  map = yeni(map); molds = yeni(molds); W = w; H = h; degisti();
}
function ciz_(x, y) {
  if (tool === '.') { map[y][x] = '.'; molds[y][x] = '.'; }
  else if (tool === '#') { map[y][x] = '#'; molds[y][x] = '.'; }
  else if (tool === 'x') { molds[y][x] = 'x'; if (map[y][x] === '#') map[y][x] = '.'; }
  else if ('rybgop'.includes(tool)) map[y][x] = tool;
  else { molds[y][x] = tool; if (map[y][x] === '#') map[y][x] = '.'; }
  degisti();
}
// Tahtayı çiz. durum verilirse (çözüm oynatma) parçalar oradan gelir ve çizim kapalıdır.
function tahta(st) {
  const el = $('board'); el.style.gridTemplateColumns = `repeat(${W},1fr)`; el.innerHTML = '';
  const parca = new Map(), dolu = new Set();
  if (st) { st.pieces.forEach((p, i) => p.cells.forEach(c => parca.set(c[0] + ',' + c[1], [p.color, i + 1]))); st.holes.forEach(h => { if (h.filled) h.cells.forEach(c => dolu.add(c[0] + ',' + c[1])); }); }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const d = document.createElement('div'), k = x + ',' + y, m = molds[y][x], ch = st ? (parca.get(k)?.[0] || '.') : map[y][x];
    d.className = 'cell' + (map[y][x] === '#' ? ' duvar' : ''); d.dataset.x = x; d.dataset.y = y; d.tabIndex = 0;
    d.setAttribute('role', 'button'); d.setAttribute('aria-label', `${x + 1}. sütun ${y + 1}. satır: ${map[y][x] === '#' ? 'duvar' : AD[ch] ? AD[ch] + ' parça' : 'boş'}${m === 'x' ? ', makas' : m !== '.' ? ', ' + AD[m.toLowerCase()] + ' kalıp' : ''}`);
    if (m === 'x') { const i = document.createElement('span'); i.className = 'mk'; i.textContent = '✂'; if (st && !st.makas.find(q => q.x === x && q.y === y)?.open) i.style.opacity = .3; d.appendChild(i); }
    else if (m !== '.') { const i = document.createElement('i'); i.className = 'kalip'; i.style.borderColor = `var(--${m.toLowerCase()})`; if (dolu.has(k)) i.style.background = `var(--${m.toLowerCase()})`; d.appendChild(i); }
    if (AD[ch]) { const i = document.createElement('i'); i.className = 'parca'; i.style.background = `var(--${ch})`; d.appendChild(i); if (st) { const n = document.createElement('span'); n.className = 'no'; n.textContent = parca.get(k)[1]; d.appendChild(n); } }
    el.appendChild(d);
  }
}
function degisti() { rap = null; adim = 0; $('oner').disabled = $('geri').disabled = $('ileri').disabled = true; tahta(); $('json').value = JSON.stringify(bolum(), null, 1); const E = K.validate(bolum()); $('rapor').innerHTML = E.length ? `<p class="kotu" style="margin:0">${E.join('<br>')}</p>` : '<p style="margin:0">Geçerli. Henüz çözülmedi.</p>'; }
function coz() {
  const L = bolum(); $('rapor').innerHTML = '<p style="margin:0">Çözülüyor…</p>';
  setTimeout(() => {
    rap = C.rapor(L); adim = 0;
    const r = rap, R = $('rapor');
    if (!r.gecerli) return void (R.innerHTML = `<p class="kotu" style="margin:0">${r.hata.join('<br>')}</p>`);
    if (!r.cozuldu) return void (R.innerHTML = `<p class="kotu" style="margin:0"><b>${r.cikmaz ? 'Çözümü yok (kanıtlandı).' : 'Çözüm bulunamadı (arama sınırında; kesin değil).'}</b></p><p style="margin:6px 0 0">${r.dugum} durum · ${r.ms.toFixed(0)} ms</p>`);
    const kip = { kalip: 'yalnız kalıp içi park', park: 'kenara çekilme gerekli', tam: 'bütün yer değiştirmeler' }[r.mod];
    R.innerHTML = `<dl>
      <dt>Çözüm</dt><dd class="iyi"><b>${r.hamle} hamle</b>, ${r.kare} kare adımı</dd>
      <dt>Karışım · kesim</dt><dd>${r.karisim} · ${r.kes}</dd>
      <dt>Yanlış yapışma kararı</dt><dd>${r.yanlis} / ${r.yapisma} karar (darlık ${r.darlik}) · renk ${r.etiket.renk}, şekil ${r.etiket.sekil}, yol ${r.etiket.yol}</dd>
      <dt>Zorluk puanı</dt><dd><b>${r.puan}</b> <small>taslak formül</small></dd>
      <dt>Önerilen süre</dt><dd><b>${r.sure} sn</b> (zor bölüm: ${r.sureZor} sn) · şimdiki ${L.t} sn</dd>
      <dt>Arama</dt><dd>${r.dugum} durum · ${r.ms.toFixed(0)} ms · ${kip}</dd>
    </dl><ol id="yol">${r.yol.map(m => `<li>${AD[m.renk]} (${m.kareler.map(c => (c[0] + 1) + ',' + (c[1] + 1)).join(' ')}) ${m.dx >= 0 ? '+' : ''}${m.dx}, ${m.dy >= 0 ? '+' : ''}${m.dy} · ${m.d} kare · ${TIP[m.tip]}</li>`).join('')}</ol>`;
    $('oner').disabled = false; oynat(0);
  }, 20);
}
function oynat(n) {
  if (!rap?.cozuldu) return;
  adim = Math.max(0, Math.min(rap.yol.length, n));
  let st = K.load(bolum()); for (let i = 0; i < adim; i++) st = C.uygula(st, rap.yol[i].i, rap.yol[i].dx, rap.yol[i].dy);
  tahta(adim ? st : null);
  $('geri').disabled = adim === 0; $('ileri').disabled = adim === rap.yol.length;
  [...document.querySelectorAll('#yol li')].forEach((li, i) => i === adim - 1 ? li.setAttribute('aria-current', 'true') : li.removeAttribute('aria-current'));
}

// araç çubuğu
TOOLS.forEach(t => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'tool'; b.title = t.ad; b.setAttribute('aria-label', t.ad); b.dataset.k = t.k;
  const i = document.createElement('i'), c = t.k.toLowerCase();
  if (t.k === '.') { i.style.cssText = 'background:var(--field);border:1px solid var(--grid)'; }
  else if (t.k === '#') i.style.background = 'var(--wall)';
  else if (t.k === 'x') { i.style.cssText = 'display:grid;place-items:center;font-style:normal;font-size:18px'; i.textContent = '✂'; }
  else if (t.k === c) i.style.background = `var(--${c})`;
  else { i.className = 'kalip'; i.style.borderColor = `var(--${c})`; }
  b.appendChild(i); b.onclick = () => sec(t.k); $('tools').appendChild(b);
});
function sec(k) { tool = k; [...$('tools').children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k))); $('arac').textContent = TOOLS.find(t => t.k === k).ad; }
// çizim: basılı tutup sürükleyerek
const hucre = e => { const d = document.elementFromPoint(e.clientX, e.clientY)?.closest?.('.cell'); return d && [+d.dataset.x, +d.dataset.y]; };
$('board').addEventListener('pointerdown', e => { if (adim) oynat(0); const c = hucre(e); if (!c) return; boya = true; ciz_(...c); e.preventDefault(); });
$('board').addEventListener('pointermove', e => { if (!boya) return; const c = hucre(e); if (c && (tool === '.' ? map[c[1]][c[0]] + molds[c[1]][c[0]] !== '..' : (map[c[1]][c[0]] !== tool && molds[c[1]][c[0]] !== tool))) ciz_(...c); });
addEventListener('pointerup', () => { boya = false; });
$('board').addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const d = e.target.closest('.cell'); if (!d) return; e.preventDefault(); const x = +d.dataset.x, y = +d.dataset.y; ciz_(x, y); $('board').children[y * W + x].focus(); });

B.forEach((_, i) => $('hazir').add(new Option(`${i + 1}. bölüm`, i)));
$('hazir').add(new Option('Boş tahta', -1), 0); $('hazir').value = -1;
$('hazir').onchange = e => { const i = +e.target.value; if (i < 0) { bos(); $('ipTr').value = $('ipEn').value = ''; degisti(); } else yukle(B[i]); };
$('en').onchange = () => boyut(+$('en').value, H); $('boy').onchange = () => boyut(W, +$('boy').value);
$('temizle').onclick = () => { bos(); degisti(); };
for (const id of ['sure', 'ipTr', 'ipEn']) $(id).oninput = () => { $('json').value = JSON.stringify(bolum(), null, 1); };
$('coz').onclick = coz; $('geri').onclick = () => oynat(adim - 1); $('ileri').onclick = () => oynat(adim + 1);
$('oner').onclick = () => { if (rap?.cozuldu) { $('sure').value = rap.sure; $('json').value = JSON.stringify(bolum(), null, 1); } };
$('al').onclick = () => { try { const L = JSON.parse($('json').value), E = K.validate(L).filter(e => !e.includes('eşit') && !e.includes('en az')); if (!Array.isArray(L.map) || E.some(e => e.includes('satır') || e.includes('harf') || e.includes('dizisi'))) throw new Error(E[0] || 'biçim'); yukle(L); $('not').textContent = 'İçe alındı.'; } catch (e) { $('not').textContent = 'Okunamadı: ' + e.message; } };
$('kopya').onclick = async () => { try { await navigator.clipboard.writeText($('json').value); $('not').textContent = 'Kopyalandı.'; } catch { $('json').select(); $('not').textContent = 'Seçildi: Ctrl+C ile kopyala.'; } };
$('indir').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(bolum(), null, 1) + '\n'], { type: 'application/json' })); a.download = 'bolum.json'; a.click(); URL.revokeObjectURL(a.href); };
// Oyunda dene: bölüm adres çubuğuyla oyuna taşınır (www/game.js #bolum=…)
$('dene').onclick = () => { const E = K.validate(bolum()); if (E.length) return void ($('not').textContent = 'Önce geçerli olmalı: ' + E[0]); window.open('../../www/index.html#bolum=' + encodeURIComponent(JSON.stringify(bolum())), '_blank'); };

bos(); sec('r'); degisti();
window.__editor = { yukle, bolum, coz, get rap() { return rap; } };
})();
</script>
</body>
</html>
