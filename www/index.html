<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ead8f6">
<title>Hamur</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/ikon-192.png">
<link rel="apple-touch-icon" href="img/ikon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Açılış: ilk kare sistem açılış ekranıyla aynı (düz zemin, ortada ikon); animasyon acilis.js'te -->
<div class="acilis" id="acilis"><img src="img/acilis.webp" alt="" width="192" height="192"><canvas aria-hidden="true"></canvas><p hidden></p></div>
<!-- Ekranlar: ana ekran, bölüm yolu, tepsi koleksiyonu, oyun. Görsellerde yazı yoktur; bütün metin ve sayılar koddan gelir. -->
<section class="ekran" id="sAna" hidden>
  <header class="ust"><span></span><button class="top" id="bAyar" type="button" aria-label="Ayarlar" data-en-label="Settings"><i style="background-image:url(img/ayarlar.webp)"></i></button></header>
  <div class="baslik-yeri" aria-hidden="true"><!-- logo: isim belli olunca --></div>
  <div class="ana-dugmeler">
    <button class="hap sari buyuk" id="bOyna" type="button"><b data-en="Play">Oyna</b><small id="oynaNo"></small></button>
    <div class="yan-yana">
      <button class="hap mor" id="bYol" type="button" data-en="Levels">Bölümler</button>
      <button class="hap yesil" id="bTepsi" type="button" data-en="Tray">Tepsi</button>
    </div>
  </div>
</section>
<section class="ekran" id="sYol" hidden>
  <header class="ust"><button class="top" id="yolGeri" type="button" aria-label="Geri" data-en-label="Back"><i class="sola" style="background-image:url(img/oynat.webp)"></i></button><h2 data-en="Levels">Bölümler</h2><span class="bos"></span></header>
  <div class="yol" id="yol"></div>
</section>
<section class="ekran" id="sTepsi" hidden>
  <header class="ust"><button class="top" id="tepsiGeri" type="button" aria-label="Geri" data-en-label="Back"><i class="sola" style="background-image:url(img/oynat.webp)"></i></button><h2 data-en="Tray">Tepsi</h2><span class="bos"></span></header>
  <p class="aciklama" data-en="Every 10 levels complete one figure.">Her 10 bölümde bir figür tamamlanır.</p>
  <div class="figurler" id="figurler"></div>
</section>
<section class="ekran app" id="sOyun" hidden>
  <header class="hud">
    <div class="row">
      <div class="nav">
        <button class="top cik" id="bCik" type="button" aria-label="Bölümlere dön" data-en-label="Back to levels"><i class="sola" style="background-image:url(img/oynat.webp)"></i></button>
        <span id="lvlNo" aria-live="polite">1</span>
      </div>
      <button class="btn resim" id="undo" type="button" aria-label="Geri al" data-en-label="Undo" disabled></button>
      <button class="btn resim" id="sound" type="button" aria-label="Ses" data-en-label="Sound"></button>
      <button class="btn resim" id="retry" type="button" aria-label="Baştan" data-en-label="Restart"></button>
    </div>
    <div class="timer" id="timer">
      <i class="saat" aria-hidden="true"></i>
      <div class="bar"><i id="fill"></i></div>
      <span id="secs">30</span>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Oyun tahtası" data-en-label="Game board"></canvas>
    <div class="tost" id="tost" role="status" hidden></div>
    <div class="ov" id="ov" hidden>
      <div class="card" role="dialog" aria-labelledby="ovT">
        <img id="ovR" alt="" width="520" height="412" hidden>
        <h2 id="ovT"></h2>
        <p id="ovP"></p>
        <button class="go" id="ovB" type="button"></button>
        <button class="go alt" id="ovB2" type="button" hidden></button>
      </div>
    </div>
  </main>
  <footer class="foot">
    <div class="rx" id="rx" hidden>
      <span><i data-c="b" role="img" aria-label="mavi" data-en-label="blue" style="background:var(--b)"></i>+<i data-c="y" role="img" aria-label="sarı" data-en-label="yellow" style="background:var(--y)"></i>=<i data-c="g" role="img" aria-label="yeşil" data-en-label="green" style="background:var(--g)"></i></span>
      <span><i data-c="r" role="img" aria-label="kırmızı" data-en-label="red" style="background:var(--r)"></i>+<i data-c="b" role="img" aria-label="mavi" data-en-label="blue" style="background:var(--b)"></i>=<i data-c="p" role="img" aria-label="mor" data-en-label="purple" style="background:var(--p)"></i></span>
      <span><i data-c="r" role="img" aria-label="kırmızı" data-en-label="red" style="background:var(--r)"></i>+<i data-c="y" role="img" aria-label="sarı" data-en-label="yellow" style="background:var(--y)"></i>=<i data-c="o" role="img" aria-label="turuncu" data-en-label="orange" style="background:var(--o)"></i></span>
    </div>
    <p id="hint"></p>
  </footer>
</section>
<!-- Ekran geçişi: un bulutu silmesi (250 ms). Bekleme: 500 ms'yi geçince oklavayla açılan hamur şeridi; reklam ve satın almada yoğrulan hamur topu. -->
<div class="gecis" id="gecis" aria-hidden="true"><i></i></div>
<div class="bekle" id="bekle" role="status" aria-label="Bekleyin" data-en-label="Please wait" hidden><div class="serit"><i class="hamur"></i><i class="oklava"></i></div><div class="yumak"></div></div>
<div class="ov tam" id="ayar" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ayarT">
    <button class="top kucuk kapat" id="ayarKapat" type="button" aria-label="Kapat" data-en-label="Close"><i style="background-image:url(img/kapat.webp)"></i></button>
    <h2 id="ayarT" data-en="Settings">Ayarlar</h2>
    <div class="secenekler" id="secenekler"></div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="ses.js"></script>
<script src="olcum.js"></script>
<script src="ads.js"></script>
<script src="shop.js"></script>
<script src="app.js"></script>
<script src="rules/cekirdek.js"></script>
<script src="rules/cozucu.js"></script>
<script src="bolumler.js"></script>
<script src="game.js"></script>
<script src="ekran.js"></script>
<script src="acilis.js"></script>
</body>
</html>
